<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--???-->
    <link rel="stylesheet" href="tabela-estilizada.css">
    <title>Tabela</title>
</head>

<body>
    <h1>Propriedades de Tabela</h1>

    <table>                                <!--"Table" é a Caixa da formulação da tabela-->
        
        <tr>                               <!--"tr" determina as linhas da tabela-->
            <th>Nomes</th>                 
            <th>1º Semestre</th>            <!--"th" é o cabeçalho da tabela-->
            <th>2º Semestre</th>
        </tr>
        <tr>
            <td>Fabiana</td>               <!--"td" corresponde os valores adicinados ao corpo da tabela-->
            <td>8.9</td>
            <td>7.6</td>
        </tr>
        <tr>
            <td>Lucas</td>
            <td>7.4</td>
            <td>8.0</td>
        </tr>  
        <tr>
            <td>Cecilia</td>
            <td>8.7</td>
            <td>9.3</td>
        </tr> 
    </table>

</body>

</html>
